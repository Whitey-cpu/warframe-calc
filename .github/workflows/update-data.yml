name: Update game data

# Refreshes data/ every Monday and on demand, from public sources only:
#   @wfcd/items (npm), warframe-public-export-plus (npm, DE Public Export repackaged),
#   the WARFRAME Wiki API (Incarnon evolutions) and warframe.com patch notes (build label).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape public web data (wiki Incarnon evolutions, patch notes)
        continue-on-error: true
        run: node scripts/scrape-web.js
      - name: Download and build data
        run: node scripts/sync-data.js
      - name: Run tests
        run: node test/test.js
      - name: Weekly meta scan (this site's own math)
        continue-on-error: true
        run: node scripts/meta-scan.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update game data to $(node -p "require('./data/game-data.json').meta.version")"
          git push
