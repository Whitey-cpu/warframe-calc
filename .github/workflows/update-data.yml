name: Update game data

# Refreshes data/ from the latest @wfcd/items every Monday and on demand.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and build data
        run: node scripts/sync-data.js
      - name: Run tests
        run: node test/test.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then echo "No data changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update game data to $(node -p "require('./data/game-data.json').meta.version")"
          git push
