# Cloudflare Worker for warframe.hardn.net accounts.
# Deployed by .github/workflows/deploy-api.yml. The D1 database_id below is filled in by that workflow.
name = "warframe-calc-api"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

[[routes]]
pattern = "warframe-api.hardn.net"
custom_domain = true

[vars]
ALLOWED_ORIGINS = "https://warframe.hardn.net"
DISCORD_REDIRECT_URI = "https://warframe-api.hardn.net/auth/discord/callback"
# DISCORD_CLIENT_ID and DISCORD_CLIENT_SECRET are set as Worker secrets by the deploy workflow.

[[d1_databases]]
binding = "DB"
database_name = "warframe-calc"
database_id = "__D1_DATABASE_ID__"
